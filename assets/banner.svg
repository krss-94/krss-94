<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a1420"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#161b22" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#grid)"/>

  <!-- circuit traces, left side -->
  <g stroke="#1f6feb" stroke-width="1.6" fill="none" opacity="0.55">
    <path d="M0,60 H90 L110,80 H220 L240,60 H340"/>
    <path d="M0,110 H60 L80,130 V190 L100,210 H180"/>
    <path d="M0,220 H130 L150,240 H260"/>
  </g>
  <g fill="#58a6ff" opacity="0.8">
    <circle cx="90" cy="60" r="3"/>
    <circle cx="220" cy="80" r="3"/>
    <circle cx="340" cy="60" r="3"/>
    <circle cx="60" cy="110" r="3"/>
    <circle cx="180" cy="210" r="3"/>
    <circle cx="130" cy="220" r="3"/>
    <circle cx="260" cy="240" r="3"/>
  </g>

  <!-- circuit traces, right side -->
  <g stroke="#1f6feb" stroke-width="1.6" fill="none" opacity="0.55">
    <path d="M1200,50 H1080 L1060,70 H980 L960,50 H880"/>
    <path d="M1200,140 H1140 L1120,160 V200 L1100,220 H1040"/>
    <path d="M1200,235 H1090 L1070,255 H1000"/>
  </g>
  <g fill="#58a6ff" opacity="0.8">
    <circle cx="1080" cy="50" r="3"/>
    <circle cx="980" cy="70" r="3"/>
    <circle cx="880" cy="50" r="3"/>
    <circle cx="1140" cy="140" r="3"/>
    <circle cx="1040" cy="220" r="3"/>
    <circle cx="1090" cy="235" r="3"/>
    <circle cx="1000" cy="255" r="3"/>
  </g>

  <!-- oscilloscope trace across the middle -->
  <path d="M0,168 L140,168 L165,120 L190,210 L215,90 L240,168 L1200,168"
        fill="none" stroke="#39d0d8" stroke-width="1.8" opacity="0.4" filter="url(#softglow)"/>
  <path d="M1200,168 L1060,168 L1035,120 L1010,210 L985,90 L960,168 L0,168"
        fill="none" stroke="#39d0d8" stroke-width="1.8" opacity="0"/>

  <!-- title -->
  <text x="600" y="132" text-anchor="middle" font-family="Consolas, 'JetBrains Mono', 'Courier New', monospace"
        font-size="46" font-weight="700" fill="#e6edf3" letter-spacing="6" filter="url(#glow)">SIVA SRINIVAS</text>

  <!-- subtitle -->
  <text x="600" y="166" text-anchor="middle" font-family="Consolas, 'JetBrains Mono', 'Courier New', monospace"
        font-size="15" fill="#7d8590" letter-spacing="3">HARDWARE SECURITY // FPGA // SIDE-CHANNEL ANALYSIS // DSP</text>

  <!-- underline accent -->
  <line x1="470" y1="184" x2="730" y2="184" stroke="#1f6feb" stroke-width="1.5" opacity="0.8"/>
</svg>
